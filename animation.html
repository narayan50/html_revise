<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      div {
        width: 150px;
        height: 150px;
        /* background-color: red; */
        position: relative;
        animation-name: moving;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      
      }

      @keyframes moving {
        0% {
          background-color:url(images/tree-7619791_1280.jpg);
        
        }
        50% {
          background:url(images/fashion-sh-1726291317_7378097_2215537.jpeg);
         
        }
        100% {
          background-color:url(images/path-6776789_1280.jpg);
          background: url(images/);
         
        }
      }
    </style>
  </head>
  <body>
    <div class="moving"></div>
  </body>
</html>
